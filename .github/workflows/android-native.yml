name: Android Native Core

on:
  push:
    branches: [ "arena/**" ]
    paths:
      - ".github/workflows/android-native.yml"
      - "tools/**"
      - "cmake/**"
      - "patches/**"
      - "android/**"
      - "src/**"
      - "CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: write   # create tags + upload release assets
  issues: write

env:
  NDK_VERSION: "27.3.13750724"
  ABI: "arm64-v8a"
  API: "28"
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  native-core:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ndk: [ "27.3.13750724" ]
    outputs:
      sdk_exit: ${{ steps.sdkbuild.outputs.sdk_exit }}
      app_exit: ${{ steps.appbuild.outputs.app_exit }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init SDK submodule
        continue-on-error: true
        run: |
          git submodule update --init --depth 1 thirdparty/rexglue-sdk 2>&1 | tail -5
          echo "--- sdk present? ---"
          ls thirdparty/rexglue-sdk | head

      - name: Init SDK third-party submodules
        continue-on-error: true
        run: |
          cd thirdparty/rexglue-sdk || exit 0
          git submodule update --init --depth 1 --jobs 4 2>&1 | tail -20
          echo "--- populated ---"
          for d in thirdparty/*/; do
            n=$(ls "$d" 2>/dev/null | wc -l)
            [ "$n" -gt 0 ] && echo "OK   $d" || echo "EMPTY $d"
          done

      - name: Apply Android patches to SDK
        run: ./tools/ci/apply_patches.sh

      - name: Probe libc++ features
        continue-on-error: true
        run: |
          NDK="$ANDROID_HOME/ndk/${{ matrix.ndk }}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++"
          "$CXX" --version | head -2 > probe.txt
          if "$CXX" -std=c++23 -c tools/ci/libcxx_probe.cpp -o /dev/null 2>probe.err; then
            echo "LIBCXX_PROBE=PASS" >> probe.txt
          else
            echo "LIBCXX_PROBE=FAIL" >> probe.txt
            head -25 probe.err >> probe.txt
          fi
          if "$CXX" -std=c++23 -fexperimental-library \
               -c tools/ci/jthread_probe.cpp -o /dev/null 2>jt.err; then
            echo "JTHREAD_WITH_EXPERIMENTAL=PASS" >> probe.txt
          else
            echo "JTHREAD_WITH_EXPERIMENTAL=FAIL" >> probe.txt
            head -15 jt.err >> probe.txt
          fi
          cat probe.txt


      - name: Configure for Android arm64
        continue-on-error: true
        run: |
          NDK="$ANDROID_HOME/ndk/${{ matrix.ndk }}"
          echo "NDK=$NDK"
          # Android 15+ devices may use 16 KB memory pages. Shared libraries
          # built with the default 4 KB max-page-size fail to load there, so
          # every ELF must be laid out with 16 KB-aligned LOAD segments.
          LINK16K="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
          set +e
          cmake -S thirdparty/rexglue-sdk -B out/android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM="android-$API" \
            -DCMAKE_BUILD_TYPE=Release \
            -DREXGLUE_BUILD_TESTS=OFF \
            -DREXGLUE_ENABLE_TRACY=OFF \
            -DREX_ANDROID_SUPPORT_DIR="$PWD/android/rex_android" \
            -DREX_ANDROID_SUPPORT_INCLUDE="$PWD/android/rex_android/include" \
            -DCMAKE_CXX_FLAGS="-fexperimental-library" \
            -DCMAKE_EXE_LINKER_FLAGS="-fexperimental-library $LINK16K" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fexperimental-library $LINK16K" \
            > configure.log 2>&1
          echo "CONFIGURE_EXIT=$?" | tee -a configure.log
          ls -la configure.log

      - name: Build
        id: sdkbuild
        continue-on-error: true
        run: |
          set +e
          if [ -d out/android ]; then
            # -k 0 keeps building after the first failure so one report shows
            # every distinct error. Parallelism is capped at 2: clang with PCH
            # peaks well above 3 GB/process and the runner was being OOM-killed
            # (ninja reported "subcommand failed" with no diagnostic at all).
            cmake --build out/android --parallel 2 -- -k 0 > build.log 2>&1
            rc=$?
            echo "BUILD_EXIT=$rc" | tee -a build.log
            echo "sdk_exit=$rc" >> "$GITHUB_OUTPUT"
          else
            echo "configure did not produce out/android; nothing to build" > build.log
            echo "sdk_exit=1" >> "$GITHUB_OUTPUT"
          fi
          ls -la build.log

      - name: Build app native library (libedgeoftime.so)
        id: appbuild
        continue-on-error: true
        run: |
          set +e
          bash tools/ci/build_app_native.sh > appbuild.log 2>&1
          rc=$?
          echo "APP_BUILD_EXIT=$rc" | tee -a appbuild.log
          echo "app_exit=$rc" >> "$GITHUB_OUTPUT"
          ls -la appbuild.log

      - name: Inspect produced binaries
        if: always()
        continue-on-error: true
        run: |
          NDK="$ANDROID_HOME/ndk/${{ matrix.ndk }}"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          {
            echo "--- shared libraries / archives produced ---"
            find out/android thirdparty/rexglue-sdk/out out/android-app -name '*.so' -o -name '*.a' 2>/dev/null \
              | head -40 | while read -r f; do
                  printf '%10s  %s\n' "$(stat -c%s "$f")" "$f"
                done
            echo ""
            echo "--- arch + 16 KB page alignment (Android 15 requirement) ---"
            find out/android thirdparty/rexglue-sdk/out out/android-app -name '*.so' 2>/dev/null | head -10 \
              | while read -r so; do
                  echo "== $so"
                  "$READELF" -h "$so" 2>/dev/null | grep -E "Machine|Class" || true
                  # LOAD segment alignment must be >= 0x4000 for 16 KB devices
                  "$READELF" -l "$so" 2>/dev/null | awk '/LOAD/{print "   LOAD align " $NF}' | sort -u
                done
          } > artifacts.txt 2>&1
          cat artifacts.txt

      - name: Stage native libraries for the APK job
        if: always()
        run: |
          mkdir -p native-libs/arm64-v8a
          for so in librexruntime.so librexgpu-xenos.so; do
            f=$(find out thirdparty/rexglue-sdk/out -name "$so" 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              cp "$f" native-libs/arm64-v8a/
            else
              echo "missing $so"
            fi
          done
          if [ -f out/android-app/libedgeoftime.so ]; then
            cp out/android-app/libedgeoftime.so native-libs/arm64-v8a/
          else
            echo "missing libedgeoftime.so"
          fi
          ls -la native-libs/arm64-v8a/

      - name: Upload native libraries artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-native-libs
          path: native-libs/arm64-v8a/*.so
          retention-days: 14

      - name: Gate on build results
        if: always()
        run: |
          if [ "${{ steps.sdkbuild.outputs.sdk_exit }}" != "0" ] || [ "${{ steps.appbuild.outputs.app_exit }}" != "0" ]; then
            echo "native-core: build failed (sdk=${{ steps.sdkbuild.outputs.sdk_exit }} app=${{ steps.appbuild.outputs.app_exit }})"
            exit 1
          fi
          echo "native-core: SDK and app-lib builds succeeded"

      - name: Report to log channel
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/strip_noise.py configure.log > cfg.clean 2>/dev/null || echo "(no configure.log)" > cfg.clean
          python3 tools/ci/strip_noise.py build.log     > bld.clean 2>/dev/null || echo "(no build.log)" > bld.clean
          python3 tools/ci/strip_noise.py appbuild.log  > app.clean 2>/dev/null || echo "(no appbuild.log)" > app.clean
          {
            echo "### Android Native Core — NDK \`${{ matrix.ndk }}\` — run ${{ github.run_id }}"
            echo "NDK=${{ matrix.ndk }} ABI=${ABI} API=${API}"
            echo ""
            echo "**Exits:** SDK build \`${{ steps.sdkbuild.outputs.sdk_exit }}\`, app lib \`${{ steps.appbuild.outputs.app_exit }}\`"
            echo ""
            echo "#### artifacts"
            echo '```'
            tail -c 6000 artifacts.txt 2>/dev/null || echo "(none)"
            echo '```'
            echo "#### libc++ probe"
            echo '```'
            cat probe.txt 2>/dev/null || echo "(no probe)"
            echo '```'
            echo "#### configure: CMake errors"
            echo '```'
            grep -A14 "CMake Error" cfg.clean | head -100 || true
            echo '```'
            echo "#### configure: tail"
            echo '```'
            tail -c 8000 cfg.clean
            echo '```'
            echo "#### build: error lines"
            echo '```'
            grep -nE "error:|FAILED:|CMake Error|undefined reference|No such file|Killed|signal" bld.clean | head -80 || echo "(no error lines matched)"
            echo '```'
            echo "#### build: FAILED blocks"
            echo '```'
            grep -A25 "FAILED:" bld.clean | head -150 || echo "(no FAILED blocks)"
            echo '```'
            echo "#### app lib: error lines"
            echo '```'
            grep -nE "error:|FAILED:|undefined reference|No such file" app.clean | head -60 || echo "(no error lines matched)"
            echo '```'
            echo "#### app lib: tail"
            echo '```'
            tail -c 6000 app.clean
            echo '```'
            echo "#### memory"
            echo '```'
            free -m || true
            dmesg 2>/dev/null | grep -i "killed process" | tail -5 || echo "(dmesg unavailable)"
            echo '```'
            echo "#### build: tail"
            echo '```'
            tail -c 10000 bld.clean
            echo '```'
          } > body.md
          gh issue comment 1 --repo ${{ github.repository }} --body-file body.md

  # ---------------------------------------------------------------------------
  # M2: package the prebuilt arm64-v8a libraries into a real installable APK.
  # ---------------------------------------------------------------------------
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: native-core
    if: needs.native-core.outputs.sdk_exit == '0' && needs.native-core.outputs.app_exit == '0'
    steps:
      - uses: actions/checkout@v4

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: arm64-native-libs
          path: native-libs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.10.2

      - name: Stage native libraries into the app
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          # download-artifact extracts the artifact's .so files either at its
          # root or under arm64-v8a/ depending on the upload layout; handle both.
          if [ -d native-libs/arm64-v8a ]; then
            cp native-libs/arm64-v8a/*.so android/app/src/main/jniLibs/arm64-v8a/
          else
            cp native-libs/*.so android/app/src/main/jniLibs/arm64-v8a/
          fi
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - name: Build debug APK
        id: apkbuild
        continue-on-error: true
        working-directory: android
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug > ../apkbuild.log 2>&1
          rc=$?
          echo "APK_BUILD_EXIT=$rc" | tee -a ../apkbuild.log
          echo "apk_exit=$rc" >> "$GITHUB_OUTPUT"

      - name: Verify APK contents
        if: always()
        continue-on-error: true
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          READELF="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          {
            echo "APK_BUILD_EXIT=${{ steps.apkbuild.outputs.apk_exit }}"
            if [ ! -f "$APK" ]; then
              echo "APK MISSING: $APK"
              exit 0
            fi
            echo "== APK file =="
            ls -la "$APK"
            echo "SHA256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo ""
            echo "== aapt2 badging (key fields) =="
            "$BT/aapt2" dump badging "$APK" 2>/dev/null \
              | grep -E "^package:|^sdkVersion|^targetSdkVersion|^native-code|application-label:|launchable-activity|application-isGame" || true
            echo ""
            echo "== packaged native libraries =="
            unzip -l "$APK" | grep -E "lib/arm64-v8a|\.so" || true
            echo ""
            echo "== packaged library arch + 16 KB alignment =="
            rm -rf /tmp/apklibs && mkdir -p /tmp/apklibs
            unzip -q "$APK" "lib/arm64-v8a/*" -d /tmp/apklibs 2>/dev/null || true
            for so in /tmp/apklibs/lib/arm64-v8a/*.so; do
              [ -e "$so" ] || continue
              echo "-- $(basename "$so")"
              "$READELF" -h "$so" 2>/dev/null | grep -E "Class:|Machine:" || true
              "$READELF" -l "$so" 2>/dev/null | awk '/LOAD/{print "   LOAD align " $NF}' | sort -u
              "$READELF" -d "$so" 2>/dev/null | grep NEEDED | sed 's/^/   /' || true
            done
          } > apk_verify.txt 2>&1
          cat apk_verify.txt

      - name: Upload APK artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: edge-of-time-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Gate on APK artifact
        if: always()
        run: |
          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "apk: no APK was produced"
            exit 1
          fi
          echo "apk: APK produced: $(ls -la android/app/build/outputs/apk/debug/app-debug.apk)"

      - name: Publish prerelease with the APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.1.0-android-alpha"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$APK")"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NOTES="$(mktemp)"
          cat > "$NOTES" <<EOF
          ## What this is

          The first Android build of the Spider-Man: Edge of Time recompilation
          port. This is a **build-integrity alpha**: the APK is real, installable
          and packages the complete arm64-v8a ReXGlue runtime, but **it cannot
          run the game yet** - the recompiled game code is generated from the
          user's own copy of the game (see \`docs/ANDROID_PORT_CODEGEN.md\`) and
          is not present in this repository.

          ## What is verified (by CI, run ${{ github.run_id }})

          - ReXGlue SDK compiles and links for arm64-v8a (librexruntime.so,
            librexgpu-xenos.so) with 16 KB page alignment.
          - The app entry library (libedgeoftime.so) builds and links against
            the SDK; it mirrors the real game boot sequence and presents through
            the SDK's own Vulkan presenter.
          - APK: \`$SIZE\` bytes, \`native-code: arm64-v8a\`, all three packaged
            libraries are ELF64 AArch64 with 16 KB-aligned LOAD segments.
          - SHA-256: \`$SHA\`

          ## What is NOT verified

          - Install/launch on a real device or emulator (no device attached to
            the build agent). Rendering, audio, input, stability and performance
            are untested. No FPS numbers are claimed.
          - Gameplay: requires the user's own \`Default.xex\` +
            \`Data/GameLogic.dll\` (title update applied) and the generated
            shader cache.

          ## Install

          \`\`\`bash
          adb install app-debug.apk
          adb logcat -s EdgeOfTime EdgeOfTimeBridge SDL AndroidRuntime
          \`\`\`

          Full details: \`docs/ANDROID_PORT_PROGRESS.md\`,
          \`docs/ANDROID_PORT_CODEGEN.md\`, \`docs/ANDROID_PORT_AUDIT.md\`.
          Build log: $RUN_URL
          EOF
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "v0.1.0-android-alpha - Android build-integrity alpha" \
              --notes-file "$NOTES"
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "v0.1.0-android-alpha - Android build-integrity alpha" \
              --notes-file "$NOTES"
          fi
          gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          echo "RELEASE_URL=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.html_url')"
          echo "published $TAG with $APK (sha256 $SHA)"

      - name: Report to log channel
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Android APK — run ${{ github.run_id }}"
            echo "Job URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "#### APK verification"
            echo '```'
            cat apk_verify.txt 2>/dev/null || echo "(no verification output)"
            echo '```'
            echo "#### gradle: error lines"
            echo '```'
            grep -nE "error:|FAILED|What went wrong|Execution failed|Could not|No such" apkbuild.log 2>/dev/null | head -60 || echo "(no error lines matched)"
            echo '```'
            echo "#### gradle: tail"
            echo '```'
            tail -c 8000 apkbuild.log 2>/dev/null || echo "(no gradle log)"
            echo '```'
          } > apk_body.md
          gh issue comment 1 --repo ${{ github.repository }} --body-file apk_body.md
